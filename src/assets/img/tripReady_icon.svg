<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Home-screen / install icon: the toolbar logo on the toolbar gradient.
       The glyph stays inside the central 80% so it survives a maskable crop. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c27b0"/>
      <stop offset="1" stop-color="#3f51b5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(40 58) scale(6)">
    <!-- Main body -->
    <rect x="14" y="22" width="36" height="34" rx="5" fill="#fff"/>
    <!-- Top handle -->
    <path d="M24 22v-6a8 8 0 0 1 16 0v6" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Front pocket -->
    <rect x="21" y="37" width="22" height="11" rx="3" fill="rgba(156,39,176,0.25)"/>
    <!-- Zipper line -->
    <line x1="27" y1="42.5" x2="37" y2="42.5" stroke="rgba(156,39,176,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Straps -->
    <path d="M18 26v18" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M46 26v18" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Checkmark badge -->
    <circle cx="48" cy="48" r="10" fill="#4caf50"/>
    <path d="M43 48l3.5 3.5L51 45" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
