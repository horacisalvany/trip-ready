<span
  cdkDropList
  id="trash-list"
  (cdkDropListDropped)="dropTrash($event)"
  class="material-icons trash-icon"
  >restore_from_trash</span
>
<div class="container">
  <div class="button-row">
    <h1 class="title">{{ list?.title }}</h1>
    <mat-icon
      *ngIf="showSharedWithInfo"
      class="shared-with-info"
      [matTooltip]="sharedWithTooltip"
      >info</mat-icon
    >
    <button
      *ngIf="canShare"
      (click)="openShareDialog()"
      class="share-list"
      mat-icon-button
      title="Share list"
    >
      <mat-icon>share</mat-icon>
    </button>
    <button
      (click)="toggleSections()"
      class="toggle-sections"
      mat-icon-button
      [title]="toggleSectionsLabel"
      [attr.aria-label]="toggleSectionsLabel"
      [attr.aria-expanded]="!sectionsCollapsed"
    >
      <mat-icon>{{ toggleSectionsIcon }}</mat-icon>
    </button>
    <button (click)="openDialogAddGroup()" mat-icon-button>
      <mat-icon>add</mat-icon>
    </button>
  </div>
  <!--
    The sections live inside their own drop list: a cdkDrag can only be dropped
    on a list its container is connected to, and CdkDrag resolves that container
    with @SkipSelf() — a cdkDropList on the section element itself is ignored.
    Sorting is off because section order is not reorderable, so the cards stay
    put while one of them is dragged to the trash.
  -->
  <div
    class="row"
    cdkDropList
    id="section-cards"
    [cdkDropListConnectedTo]="['trash-list']"
    [cdkDropListSortingDisabled]="true"
  >
    <div
      *ngFor="let section of list?.sections; let i = index"
      class="col-6 col-md-4"
      cdkDrag
      [cdkDragData]="{ type: 'section', id: section.id }"
      [cdkDragStartDelay]="dragStartDelay"
    >
      <div class="section-header" cdkDragHandle>
        <mat-icon class="drag-handle">drag_indicator</mat-icon>
        <h2>{{ section.title }}</h2>
      </div>
      <ng-container *ngIf="!sectionsCollapsed">
        <mat-list
          role="list"
          cdkDropList
          [cdkDropListData]="section.items"
          [id]="'cdk-drop-list-section-' + section.id"
          [cdkDropListConnectedTo]="getItemConnectedIds(section.id)"
          (cdkDropListDropped)="dropItem($event)"
        >
          <mat-list-item
            cdkDrag
            [cdkDragData]="{ type: 'item', sectionId: section.id }"
            [cdkDragStartDelay]="dragStartDelay"
            *ngFor="let item of section.items"
          >{{ item }}</mat-list-item>
        </mat-list>
        <div class="add-item-row">
          <input
            #itemInput
            type="text"
            maxlength="40"
            placeholder="New item..."
            (keyup.enter)="
              onAddItemToSection(section.id, itemInput.value);
              itemInput.value = ''
            "
          />
          <button
            mat-icon-button
            (click)="
              onAddItemToSection(section.id, itemInput.value);
              itemInput.value = ''
            "
          >
            <mat-icon>add</mat-icon>
          </button>
        </div>
      </ng-container>
    </div>
  </div>
</div>
