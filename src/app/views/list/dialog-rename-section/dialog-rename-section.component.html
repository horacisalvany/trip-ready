<h2 mat-dialog-title>Rename section</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Section name</mat-label>
    <input
      matInput
      cdkFocusInitial
      class="section-title"
      [(ngModel)]="title"
      type="text"
      maxlength="40"
      placeholder="Ex. Beach gear"
      (keyup.enter)="onRename()"
    />
  </mat-form-field>
  <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" class="rename" (click)="onRename()">
    Rename
  </button>
</mat-dialog-actions>
