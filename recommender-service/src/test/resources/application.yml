---
# Only applies when no other profile is active (e.g. plain @WebMvcTest slices), so it does not
# mask a dropped app.cors.allowed-origin in application-prod.yml when prod is explicitly active
# (see ProdProfileSmokeTest).
spring:
  config:
    activate:
      on-profile: default
app:
  cors:
    allowed-origin: http://localhost:4200
